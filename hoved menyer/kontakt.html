    <style>
.kontakt-liste {
  max-width: 700px;
  margin: 80px auto 40px auto; /* Øk margin-top for mer avstand */
  display: flex;
  flex-direction: column;
  gap: 24px;
}
.kontakt {
  display: flex;
  align-items: center;
  gap: 20px;
  border-radius: 10px;
  padding: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: box-shadow 0.2s, transform 0.2s, background 0.2s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.kontakt:hover {
  box-shadow: 0 8px 24px rgba(62,122,164,0.18);
  transform: translateY(-2px) scale(1.03);
}
.kontakt img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #7389f6;
  transition: border-color 0.2s, transform 0.2s;
}
.kontakt:hover img {
  transform: scale(1.08) rotate(-4deg);
}
.kontakt-info h2 {
  margin: 0 0 8px 0;
  font-size: 1.2em;
  transition: color 0.2s;
}
.kontakt:hover .kontakt-info h2 {
  color: #3e7aa4;
}
@media (max-width: 700px) {
  .kontakt {
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
  }
  .kontakt img {
    width: 64px;
    height: 64px;
  }
}

    </style>
