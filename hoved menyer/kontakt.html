<!doctype html>
<html>
<head>
  <title>Jan Olav</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/hover.css">
  <link rel="stylesheet" href="css/mobil.css">
  <link rel="stylesheet" href="css/lys-modus.css">
  <link rel="stylesheet" href="css/mørk-modus.css">
  <link rel="stylesheet" href="css/navigerings-bar.css">
  <link rel="stylesheet" href="css/styling.css">
  <link rel="stylesheet" href="css/lightbox.css">
  <link rel="icon" type="image/png" href="bilder/favicon-16x16.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    .contact-list {
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 40px auto;
    }
    .contact {
      margin-top: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: box-shadow 0.3s, transform 0.3s, background 0.3s;
    }
    .contact:hover img,
    .contact:focus img {
      transform: scale(1.12) rotate(-4deg);
      border-color: #3e7aa4;
    }
    .contact-info h2 {
      margin: 0 0 8px 0;
      font-size: 1.2em;
      transition: color 0.2s;
    }
    .contact:hover .contact-info h2,
    .contact:focus .contact-info h2 {
      color: #3e7aa4;
    }
    .contact img {
      margin: 10px;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border: 2px solid #7389f6;
      border-radius: 50%;
      transition: border-color 0.2s, transform 0.2s;
    }
  </style>
</head>
<body>
  <!-- Navigation bar -->
  <ul id="knapper">
    <li class="logo">
      <a href="index.html">
        <img src="bilder/logo.png" alt="Logo" class="nav-logo">
      </a>
    </li>
    <li><a id="homeButton" href="index.html" class="active"><i class="fa fa-home"></i></a></li>
    <li><a id="menuButton"><i class="fa fa-bars"></i></a></li>
  </ul>
  <div id="menuContent" class="hidden">
    <ul>
      <li><a href="kontakt.html">Kontakt</a></li>
      <li><a href="om-meg.html">Om meg</a></li>
      <li><a href="prosjekt-meny.html">Prosjekter</a></li>
    </ul>
  </div>
  <!-- Contact list -->
  <div class="contact-list main-container">
    <div class="contact card-color effect-color effect">
      <img src="bilder/profil-bilde.jpg" alt="Jan Olav" onclick="showLightbox(this.src)">
      <div class="contact-info">
        <h2>Jan Olav</h2>
        <p>E-mail: janolavgrimsrud@gmail.com</p>
        <div class="link">
          <a href="https://github.com/jangri09" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        </div>
      </div>
    </div>
    <div class="contact card-color effect-color effect">
      <img src="kontakt-bilder/bjarte.jpg" alt="Bjarte" onclick="showLightbox(this.src)">
      <div class="contact-info">
        <h2>Bjarte</h2>
        <p>E-mail: bjarte@example.com</p>
        <div class="link">
          <a href="https://instagram.com/bjarte" target="_blank"><i class="fab fa-instagram"></i> Instagram</a>
        </div>
      </div>
    </div>
    <div class="contact card-color effect-color effect">
      <img src="kontakt-bilder/kåre.jpg" alt="Kåre" onclick="showLightbox(this.src)">
      <div class="contact-info">
        <h2>Kåre</h2>
        <p>E-mail: kare@example.com</p>
        <div class="link">
          <a href="https://github.com/kåre" target="_blank"><i class="fab fa-github"></i> GitHub</a>
        </div>
      </div>
    </div>
    <!-- Add more contacts here -->
  </div>
  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" style="display:none;">
    <button class="close-btn" onclick="closeLightbox()">×</button>
    <img id="lightbox-img" src="" alt="Large image">
  </div>
  <script src="Js/menu.js"></script>
  <script src="Js/lightbox.js"></script>
</body>
</html>
